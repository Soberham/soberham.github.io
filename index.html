<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>马年专属 · 新春祝福</title>
    <style>
        /* 全局样式 & 喜庆氛围 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Noto Serif SC', '华文楷体', 'KaiTi', 'Microsoft YaHei', serif;
        }

        body {
            min-height: 100vh;
            background: radial-gradient(circle at 30% 10%, #fce5b4, #b31b1b 80%, #7a0f0f);
            background-attachment: fixed;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
            position: relative;
            overflow-x: hidden;
        }

        /* 装饰性金色光斑 & 马年元素 */
        body::before {
            content: "";
            position: absolute;
            inset: 0;
            background: url('data:image/svg+xml;utf8,<svg width="60" height="60" viewBox="0 0 60 60" xmlns="http://www.w3.org/2000/svg"><path d="M20 10 Q30 0 40 10 L45 18 Q30 28 15 18 L20 10" fill="none" stroke="rgba(255,215,0,0.2)" stroke-width="1.5"/><circle cx="32" cy="12" r="2" fill="rgba(255,230,130,0.3)"/><text x="8" y="40" font-size="12" fill="rgba(255,230,150,0.15)" font-family="Arial">🐴</text></svg>');
            background-repeat: repeat;
            opacity: 0.3;
            pointer-events: none;
            z-index: 0;
        }

        /* 浮动金箔粒子 */
        .floating-particle {
            position: absolute;
            width: 12px;
            height: 12px;
            background: rgba(255, 210, 90, 0.5);
            border-radius: 50%;
            filter: blur(4px);
            animation: floatAround 18s infinite alternate ease-in-out;
            z-index: 0;
        }
        .floating-particle:nth-child(1) { top: 10%; left: 5%; width: 30px; height: 30px; background: rgba(255,200,50,0.2); animation-duration: 22s; }
        .floating-particle:nth-child(2) { bottom: 15%; right: 8%; width: 45px; height: 45px; background: rgba(230,180,40,0.2); animation-duration: 25s; animation-delay: -5s; }
        .floating-particle:nth-child(3) { top: 30%; right: 15%; width: 20px; height: 20px; background: rgba(255,220,100,0.3); animation-duration: 15s; }
        .floating-particle:nth-child(4) { bottom: 30%; left: 12%; width: 35px; height: 35px; background: rgba(245,200,70,0.2); animation-duration: 20s; animation-delay: -2s; }

        @keyframes floatAround {
            0% { transform: translate(0, 0) scale(1); opacity: 0.2; }
            100% { transform: translate(30px, -30px) scale(1.3); opacity: 0.4; }
        }

        .main-card {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 600px;
            background: rgba(120, 10, 10, 0.6);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 2px solid #f5c56b;
            border-radius: 48px 48px 32px 32px;
            box-shadow: 0 30px 40px rgba(0,0,0,0.5), 0 0 0 2px #fde8b3 inset, 0 0 20px #ffd966;
            padding: 2.5rem 1.8rem;
            color: #fef3d6;
            text-shadow: 2px 2px 4px #4f0303;
            transition: all 0.3s;
        }

        /* 顶部装饰文字 — 如图片所示 "新年快乐 2026 HAPPYNEWYEAR" */
        .hero-text {
            text-align: center;
            margin-bottom: 2rem;
            border-bottom: 2px dashed #f7c35c;
            padding-bottom: 1.2rem;
        }
        .hero-text .chinese-big {
            font-size: 3.2rem;
            font-weight: 900;
            line-height: 1.2;
            letter-spacing: 6px;
            color: #fff3c9;
            text-shadow: 0 0 8px #efb43c, 0 4px 8px #711212;
        }
        .hero-text .year {
            font-size: 3rem;
            font-weight: 600;
            background: linear-gradient(135deg, #fcee9f, #ffc964);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 2px 5px #a32020;
            margin: 0 0.3rem;
        }
        .hero-text .english {
            font-size: 1.6rem;
            letter-spacing: 6px;
            word-break: keep-all;
            background: linear-gradient(135deg, #fde6a6, #ffcf7a);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 2px 4px #7a1f1f;
        }
        .hero-text .horse-emoji {
            font-size: 2.4rem;
            filter: drop-shadow(0 4px 3px #390404);
        }

        /* 标题&指引 */
        .sub-title {
            font-size: 1.5rem;
            text-align: center;
            margin: 0.5rem 0 1.8rem;
            color: #ffdfa0;
            font-weight: 500;
        }

        /* 输入框 */
        .input-group {
            display: flex;
            flex-direction: column;
            gap: 1.2rem;
            margin-top: 1rem;
        }
        .input-field {
            padding: 1rem 1.5rem;
            border-radius: 60px;
            border: 2px solid #f1c06b;
            background: rgba(40, 4, 4, 0.7);
            backdrop-filter: blur(4px);
            font-size: 1.3rem;
            color: #fef9e0;
            text-align: center;
            outline: none;
            transition: all 0.25s;
            box-shadow: 0 0 0 2px #b1451a inset;
        }
        .input-field:focus {
            border-color: #fedb89;
            box-shadow: 0 0 20px #ffb347, 0 0 0 3px #fdbb5d inset;
            background: rgba(80, 10, 10, 0.7);
        }
        .input-field::placeholder {
            color: #efc793;
            opacity: 0.8;
            font-size: 1.1rem;
        }

        .btn {
            background: linear-gradient(145deg, #d42919, #a81010);
            border: 2px solid #fcdb9f;
            border-radius: 60px;
            padding: 1rem 0.8rem;
            font-size: 1.8rem;
            font-weight: bold;
            color: #ffefc0;
            text-shadow: 0 2px 4px #3f0303;
            letter-spacing: 4px;
            cursor: pointer;
            box-shadow: 0 10px 0 #630909, 0 6px 20px #ffbe5c;
            transition: all 0.08s linear;
            margin-top: 1rem;
            border-top-color: #ffcf8a;
            border-left-color: #ffcf8a;
            border-right-color: #ac5b2a;
            border-bottom-color: #ac5b2a;
        }
        .btn:active {
            transform: translateY(6px);
            box-shadow: 0 4px 0 #630909, 0 10px 20px #fdb950;
        }

        /* 祝福语卡片渐显区域 */
        .blessing-container {
            margin: 2rem 0 1.5rem;
            text-align: center;
            background: rgba(70, 7, 7, 0.5);
            border-radius: 60px;
            padding: 2.2rem 1.5rem;
            border: 1px solid #f5c16a;
            box-shadow: inset 0 0 40px #2f0101, 0 8px 0 #4b0808;
        }

        .greeting-text {
            font-size: 2rem;
            line-height: 1.6;
            color: #fff7dd;
            text-shadow: 0 2px 10px #f7b84d, 0 4px 6px #5f0f0f;
            word-break: break-word;
            opacity: 0;  /* 初始隐藏，用于渐显 */
            animation: gentleFadeIn 1.8s ease-out forwards;
        }

        @keyframes gentleFadeIn {
            0% { opacity: 0; transform: translateY(15px); filter: blur(2px); }
            100% { opacity: 1; transform: translateY(0); filter: blur(0); }
        }

        .back-link {
            display: inline-block;
            margin-top: 2rem;
            font-size: 1.4rem;
            color: #fbe5ab;
            text-decoration: none;
            border-bottom: 2px dotted #f5c56b;
            padding-bottom: 3px;
            transition: 0.2s;
        }
        .back-link:hover {
            color: #ffd966;
            border-bottom: 2px solid #ffd966;
            transform: scale(1.02);
        }

        .friend-note {
            font-size: 1.1rem;
            margin-top: 1.5rem;
            color: #fad896;
            border-top: 1px solid #d4933c;
            padding-top: 1rem;
            opacity: 0.8;
        }

        .btn-small {
            font-size: 1.3rem;
            padding: 0.7rem 1.8rem;
            background: #942020;
            border-radius: 40px;
            border: 2px solid #fac775;
            color: #fef7cf;
            text-decoration: none;
            display: inline-block;
            margin: 0.5rem 0;
            box-shadow: 0 5px 0 #4f0b0b;
            transition: 0.08s linear;
        }
        .btn-small:active {
            transform: translateY(4px);
            box-shadow: 0 1px 0 #4f0b0b;
        }
    </style>
</head>
<body>
    <!-- 浮动氛围粒子 -->
    <div class="floating-particle"></div>
    <div class="floating-particle"></div>
    <div class="floating-particle"></div>
    <div class="floating-particle"></div>

    <!-- 主要卡片 根据不同页面内容微调，使用相同结构 -->
    <div class="main-card">
        <div class="hero-text">
            <div class="horse-emoji">✨✨</div>
            <div class="chinese-big">新年快乐</div>
            <div><span class="year">2026</span> <span class="english">HAPPYNEWYEAR</span></div>
            <div style="font-size:1.3rem; margin-top:6px; color:#ffd89c;">农历丙午马年 · 大吉</div>
        </div>

        <!-- index.html 内容开始 (输入页面) -->
        <div class="sub-title">邵渤涵给您拜年了~</div>
        <p style="text-align:center; margin-bottom:0.8rem; font-size:1.2rem;">输入名字，领取专属祝福</p>
        
        <div class="input-group">
            <input type="text" class="input-field" id="nameInput"  autofocus>
            <button class="btn" id="sendBtn">领取祝福</button>
        </div>
        <div class="friend-note">
                    #输入特殊暗号，可以领取新年红包！<br>

        </div>

        <!-- index.html 结束 -->
    </div>

    <script>
        (function() {
            // 仅用于 index.html 的提交逻辑
            const btn = document.getElementById('sendBtn');
            const input = document.getElementById('nameInput');
            
            function goToGreeting() {
                let name = input.value.trim();
                if (name === '') {
                    alert('请输入您的名字～');
                    return;
                }
                // 跳转到祝福页，URL 编码名字
                window.location.href = `greeting.html?name=${encodeURIComponent(name)}`;
            }

            btn.addEventListener('click', goToGreeting);
            input.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    goToGreeting();
                }
            });
        })();
    </script>
</body>
</html>
